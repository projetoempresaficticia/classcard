<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="pc-versao" content="3af12e18181c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassCard</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#005ED7" />
  <link rel="stylesheet" href="web/estilos.css?v=1dcd353c" />
  <script src="web/atualizar.js?v=83b69445"></script>
</head>
<!-- `modo-entrada` vem já daqui: posta só por JS haveria um flash com
     o desenho grande antes de a sessão ser verificada. O app.js tira-a
     quando a carteirinha aparece. -->
<body class="tema-cartao modo-entrada">
  <header>
    <div class="cabecalho-marca">
      <img class="marca-icone" src="web/marca/classcard-512.png" alt="" width="38" height="38" />
      <strong>ClassCard</strong>
    </div>
    <a href="admin.html">Admin</a>
  </header>

  <main>
    <div id="area-login">
      <form id="form-login">
        <h2>Entrar</h2>
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-cartao" hidden>
      <div class="cartao">
        <div class="cartao-topo"></div>

        <div class="cartao-cabecalho">
          <div class="cartao-crista">CC</div>
          <div class="cartao-titulo">
            <div class="titulo-principal">CLASSCARD</div>
            <div class="titulo-secundario">Prepara Portugal · Identidade Estudantil</div>
          </div>
        </div>

        <div class="cartao-principal">
          <label class="cartao-avatar" for="c-foto-input">
            <span id="c-avatar-conteudo">—</span>
            <span class="cartao-avatar-dica">trocar foto</span>
          </label>
          <input type="file" id="c-foto-input" accept="image/*" hidden />
          <div class="cartao-info">
            <div class="nome" id="c-nome">—</div>
            <div class="cedula" id="c-cedula">—</div>
            <div class="cartao-grade">
              <div class="cartao-campo">
                <div class="rotulo">Empresa</div>
                <div class="valor" id="c-empresa">—</div>
              </div>
              <div class="cartao-campo">
                <div class="rotulo">Papel</div>
                <div class="valor" id="c-papel">—</div>
              </div>
            </div>
          </div>
        </div>

        <div class="cartao-rodape">
          <a id="c-qr-link" class="qr-caixa" target="_blank" rel="noopener">
            <div id="c-qr"></div>
          </a>
          <div class="legenda">Escaneie<br />ou toque<br />para verificar</div>
          <span class="estado-badge" id="c-estado">—</span>
        </div>
      </div>
      <button class="botao-pilula" id="btn-sair" type="button">Sair</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="app.js?v=91e0a22a"></script>
</body>
</html>
