<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassCard</title>
  <link rel="stylesheet" href="web/estilos.css" />
</head>
<body class="tema-cartao">
  <header>
    <strong>ClassCard</strong>
    <a href="admin.html">Admin</a>
  </header>

  <main>
    <div id="area-login">
      <form id="form-login">
        <h2>Entrar</h2>
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-cartao" hidden>
      <div class="cartao">
        <div class="cartao-topo"></div>
        <div class="cartao-corpo">
          <div class="cartao-identidade">
            <div class="cartao-avatar" id="c-avatar">—</div>
            <div>
              <div class="nome" id="c-nome">—</div>
              <div class="cedula" id="c-cedula">—</div>
            </div>
          </div>

          <div class="cartao-divisoria"></div>

          <div class="cartao-grade">
            <div class="cartao-campo">
              <div class="rotulo">Empresa</div>
              <div class="valor" id="c-empresa">—</div>
            </div>
            <div class="cartao-campo">
              <div class="rotulo">Papel</div>
              <div class="valor" id="c-papel">—</div>
            </div>
            <div class="cartao-campo">
              <div class="rotulo">Estado</div>
              <div class="valor"><span class="estado-badge" id="c-estado">—</span></div>
            </div>
          </div>

          <div class="cartao-divisoria"></div>
        </div>

        <div class="cartao-rodape">
          <div id="c-qr" class="qr-caixa"></div>
          <div class="legenda">Escaneie<br />para verificar</div>
        </div>
      </div>
      <button class="botao-pilula" id="btn-sair" type="button">Sair</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="app.js"></script>
</body>
</html>
