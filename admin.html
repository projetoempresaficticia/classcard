<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="pc-versao" content="3af12e18181c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassCard — Admin</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#005ED7" />
  <link rel="stylesheet" href="web/estilos.css?v=1dcd353c" />
  <script src="web/atualizar.js?v=83b69445"></script>
</head>
<body>
  <header>
    <div class="cabecalho-marca">
      <img class="marca-icone" src="web/marca/classcard-512.png" alt="" width="38" height="38" />
      <strong>ClassCard — Admin</strong>
    </div>
    <a href="index.html">← Cartão</a>
  </header>

  <main>
    <div id="area-login">
      <form id="form-login">
        <h2>Entrar como professor/admin</h2>
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-admin" hidden>
      <nav class="abas abas-principais">
        <button type="button" class="aba aba-ativa" data-secao="secao-pessoa">Registar pessoa</button>
        <button type="button" class="aba" data-secao="secao-empresa">Registar empresa</button>
        <button type="button" class="aba" data-secao="secao-vincular">Vincular</button>
        <button type="button" class="aba" data-secao="secao-buscar">Buscar</button>
        <button type="button" class="aba" data-secao="secao-diretorio">Diretório</button>
      </nav>

      <div id="secao-pessoa" class="secao-admin">
        <form id="form-pessoa">
          <h2>Registar pessoa</h2>
          <label>Nome</label>
          <input id="p-nome" required />
          <label>Email de login</label>
          <input id="p-email-login" type="email" required />
          <label>Senha inicial</label>
          <div class="campo-com-botao">
            <input id="p-senha" required minlength="6" placeholder="mínimo 6 caracteres" />
            <button type="button" id="p-gerar-senha">Gerar</button>
          </div>
          <label>Email interno (Correio)</label>
          <input id="p-email-interno" type="email" />
          <label>Papel</label>
          <select id="p-papel">
            <option value="aluno">aluno</option>
            <option value="professor">professor</option>
            <option value="funcionario-orgao">funcionário-órgão</option>
          </select>
          <button type="submit">Registar pessoa</button>
          <p class="msg" id="msg-pessoa"></p>
        </form>
      </div>

      <div id="secao-empresa" class="secao-admin" hidden>
        <form id="form-empresa">
          <h2>Registar empresa</h2>
          <label>Nome</label>
          <input id="e-nome" required />
          <label>Email da empresa</label>
          <input id="e-email" type="email" />
          <label>Região</label>
          <input id="e-regiao" />
          <label>Setor</label>
          <input id="e-setor" />
          <button type="submit">Registar empresa</button>
          <p class="msg" id="msg-empresa"></p>
        </form>
      </div>

      <div id="secao-vincular" class="secao-admin" hidden>
        <form id="form-vincular">
          <h2>Vincular pessoa a empresa</h2>
          <label>Cédula da pessoa (PP-...)</label>
          <input id="v-pessoa" required />
          <label>Cédula da empresa (EP-...)</label>
          <input id="v-empresa" required />
          <button type="submit">Vincular</button>
          <p class="msg" id="msg-vincular"></p>
        </form>
      </div>

      <div id="secao-buscar" class="secao-admin" hidden>
        <form id="form-buscar">
          <h2>Buscar por cédula</h2>
          <label>Cédula (PP-... ou EP-...)</label>
          <input id="b-cedula" required />
          <button type="submit">Buscar</button>
          <p class="msg" id="msg-buscar"></p>
          <table id="tabela-busca" hidden>
            <tbody></tbody>
          </table>
        </form>
      </div>

      <div id="secao-diretorio" class="secao-admin" hidden>
        <section class="painel-diretorio">
          <div class="abas">
            <button type="button" id="aba-alunos" class="aba aba-ativa">Somente alunos</button>
            <button type="button" id="aba-empresas" class="aba">Somente empresas</button>
          </div>

          <table id="tabela-alunos">
            <thead>
              <tr><th>Cédula</th><th>Nome</th><th>Empresa</th><th>Estado</th></tr>
            </thead>
            <tbody></tbody>
          </table>

          <div id="lista-empresas" hidden></div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="admin.js?v=0aa49b56"></script>
</body>
</html>
